name: Integration security checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest httpx fastapi pydantic pydantic-settings sqlalchemy pyjwt bcrypt email-validator openai
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run security tests
        run: python -m pytest -q tests/test_security_checks.py tests/test_gateway_smoke.py
