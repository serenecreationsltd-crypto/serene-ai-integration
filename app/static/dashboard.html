<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serene Intelligence - Admin Dashboard</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="logo">
          <h2>Serene</h2>
          <p>Intelligence</p>
        </div>
        <nav class="nav-menu">
          <a href="#" class="nav-item active" data-view="overview">Overview</a>
          <a href="#" class="nav-item" data-view="conversations">Conversations</a>
          <a href="#" class="nav-item" data-view="knowledge">Knowledge Base</a>
          <a href="#" class="nav-item" data-view="users">Users</a>
          <a href="#" class="nav-item" data-view="settings">Settings</a>
        </nav>
        <div class="sidebar-footer">
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </aside>

      <main class="main-content">
        <!-- Overview Section -->
        <section id="overview" class="view-section active">
          <h1>Dashboard Overview</h1>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="total-conversations">-</div>
              <div class="stat-label">Total Conversations</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="total-messages">-</div>
              <div class="stat-label">Total Messages</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="active-users">-</div>
              <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="llm-calls">-</div>
              <div class="stat-label">LLM Calls Today</div>
            </div>
          </div>
        </section>

        <!-- Knowledge Base Section -->
        <section id="knowledge" class="view-section">
          <h1>Knowledge Base Management</h1>
          <div class="kb-controls">
            <button id="add-kb-btn" class="btn-primary">Add Item</button>
          </div>
          <div id="kb-list" class="kb-list"></div>
        </section>

        <!-- Conversations Section -->
        <section id="conversations" class="view-section">
          <h1>Recent Conversations</h1>
          <div id="conversations-list" class="conversations-list"></div>
        </section>
      </main>
    </div>

    <script src="/dashboard.js"></script>
  </body>
</html>
