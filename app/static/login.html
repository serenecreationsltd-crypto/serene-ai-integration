<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serene Intelligence - Login</title>
    <style>
      :root {
        --color-bg: #f7f3ee;
        --color-primary: #231f1d;
        --color-text: #1d1b1a;
        --color-text-secondary: #7d645e;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #f7f3ee, #f0ebe7);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-container {
        background: white;
        padding: 48px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(35, 23, 19, 0.1);
        max-width: 400px;
        width: 100%;
      }

      .login-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .login-header h1 {
        font-size: 2rem;
        color: var(--color-primary);
        margin-bottom: 8px;
      }

      .login-header p {
        color: var(--color-text-secondary);
        font-size: 0.95rem;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--color-primary);
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid rgba(93, 74, 69, 0.2);
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
      }

      input:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(35, 23, 19, 0.1);
      }

      .login-btn {
        width: 100%;
        padding: 12px;
        background: var(--color-primary);
        color: #f5f1ee;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .login-btn:hover {
        background: #3a3531;
      }

      .error-message {
        color: #c41e3a;
        font-size: 0.9rem;
        margin-bottom: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>Serene Intelligence</h1>
        <p>Admin Dashboard</p>
      </div>

      <div id="error" class="error-message" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });

          if (response.ok) {
            const data = await response.json();
            if (data.user.is_admin) {
              localStorage.setItem('auth_token', data.access_token);
              localStorage.setItem('current_user', JSON.stringify(data.user));
              window.location.href = '/dashboard.html';
            } else {
              errorDiv.textContent = 'Admin access required';
              errorDiv.style.display = 'block';
            }
          } else {
            errorDiv.textContent = 'Invalid username or password';
            errorDiv.style.display = 'block';
          }
        } catch (error) {
          errorDiv.textContent = 'Login failed. Please try again.';
          errorDiv.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
